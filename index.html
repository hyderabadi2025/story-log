<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Story Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      background: #0e0e14;
      color: #eeeaff;
      min-height: 100vh;
      padding: 36px 20px 60px;
    }

    .container { max-width: 600px; margin: 0 auto; }

    /* ── Header ── */
    .header {
      padding-bottom: 14px;
      border-bottom: 2px solid #eeeaff;
      margin-bottom: 28px;
    }

    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 2.2rem;
      font-weight: 900;
      color: #eeeaff;
      letter-spacing: -0.5px;
      line-height: 1;
    }

    .subtitle {
      font-size: 0.72rem;
      color: #3e3e58;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin-top: 8px;
    }

    /* ── Form card ── */
    .card {
      background: #13131c;
      border: 1px solid #22222f;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 0.68rem;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: #3e3e58;
      margin-bottom: 6px;
      margin-top: 14px;
    }

    label:first-child { margin-top: 0; }

    input {
      width: 100%;
      background: #0a0a10;
      border: 1px solid #22222f;
      border-radius: 8px;
      padding: 10px 12px;
      color: #eeeaff;
      font-size: 0.95rem;
      font-family: sans-serif;
      transition: border-color 0.2s;
    }

    input::placeholder { color: #2e2e44; }
    input:focus { outline: none; border-color: #8b7fdf; }

    .add-btn {
      margin-top: 16px;
      width: 100%;
      background: #eeeaff;
      color: #0e0e14;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 800;
      font-family: sans-serif;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .add-btn:hover:not(:disabled) { background: #ffffff; }
    .add-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .error {
      margin-top: 10px;
      color: #e05c7a;
      font-size: 0.82rem;
    }

    .fetch-status {
      margin-top: 6px;
      font-size: 0.78rem;
      color: #3e3e58;
      min-height: 1rem;
    }

    /* ── Search ── */
    .search-wrap {
      position: relative;
      margin-bottom: 20px;
    }

    .search-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: #3e3e58;
    }

    #search {
      padding-left: 36px;
      padding-right: 32px;
      background: #13131c;
      border-color: #22222f;
    }

    #search:focus { border-color: #8b7fdf; }

    .search-clear {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #3e3e58;
      cursor: pointer;
      font-size: 0.85rem;
      padding: 4px;
      line-height: 1;
      display: none;
    }

    .search-clear:hover { color: #eeeaff; }

    /* ── Story list ── */
    ul { list-style: none; }

    li {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 15px 0;
      border-bottom: 1px solid #1a1a26;
    }

    li:last-child { border-bottom: none; }

    .story-info { flex: 1; min-width: 0; }

    .story-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1rem;
      font-weight: 700;
      color: #eeeaff;
      text-decoration: none;
      line-height: 1.4;
      display: block;
      margin-bottom: 5px;
    }

    .story-title:hover { color: #c8c0ff; }

    .story-meta {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .story-author {
      font-family: Georgia, serif;
      font-style: italic;
      font-size: 0.82rem;
      color: #8b7fdf;
    }

    .meta-dot { font-size: 0.6rem; color: #3e3e58; }

    .story-site {
      display: inline-block;
      font-size: 0.62rem;
      color: #6868a0;
      background: #16162a;
      border: 1px solid #26263a;
      border-radius: 20px;
      padding: 2px 8px;
      letter-spacing: 0.5px;
      text-transform: lowercase;
    }

    .del {
      flex-shrink: 0;
      background: none;
      border: none;
      color: #2e2e44;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 4px 6px;
      border-radius: 4px;
      margin-top: 2px;
      transition: color 0.15s, background 0.15s;
      line-height: 1;
    }

    .del:hover { color: #e05c7a; background: #1e1018; }

    /* ── Empty & loading states ── */
    .empty {
      text-align: center;
      padding: 48px 20px;
      color: #2e2e44;
      border: 1px dashed #1a1a26;
      border-radius: 10px;
    }

    .empty-icon { font-size: 2rem; margin-bottom: 10px; }
    .empty-msg  { font-size: 0.9rem; color: #3e3e58; }

    .loading {
      text-align: center;
      padding: 32px;
      color: #3e3e58;
    }

    /* ── Embedding Tools panel ── */
    .tools-section {
      margin-top: 48px;
      border-top: 1px solid #1a1a26;
      padding-top: 20px;
    }

    .tools-toggle {
      width: 100%;
      background: none;
      border: 1px solid #22222f;
      border-radius: 8px;
      color: #3e3e58;
      font-size: 0.72rem;
      font-family: sans-serif;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 10px 14px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
      text-align: left;
    }

    .tools-toggle:hover { color: #eeeaff; border-color: #3e3e58; }

    .tools-panel {
      display: none;
      margin-top: 16px;
      background: #13131c;
      border: 1px solid #22222f;
      border-radius: 14px;
      padding: 20px;
    }

    .tools-panel.open { display: block; }

    .embed-count {
      font-size: 0.72rem;
      color: #3e3e58;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .embed-count span { color: #8b7fdf; font-weight: 700; }

    .progress-wrap {
      background: #0a0a10;
      border-radius: 20px;
      height: 5px;
      margin: 14px 0 8px;
      overflow: hidden;
      display: none;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #6b5fd4, #8b7fdf);
      border-radius: 20px;
      width: 0%;
      transition: width 0.4s ease;
    }

    .embed-status {
      font-size: 0.78rem;
      color: #3e3e58;
      min-height: 1.2rem;
      margin-bottom: 14px;
      line-height: 1.4;
    }

    .embed-status.success { color: #4caf87; }
    .embed-status.error   { color: #e05c7a; }
    .embed-status.warn    { color: #e8a84b; }

    .embed-btn {
      width: 100%;
      background: #1a1a2e;
      color: #8b7fdf;
      border: 1px solid #2a2a44;
      border-radius: 10px;
      padding: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      font-family: sans-serif;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .embed-btn:hover:not(:disabled) { background: #22223a; color: #c8c0ff; }
    .embed-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="container">

    <div class="header">
      <h1>My Story Log</h1>
      <p class="subtitle" id="subtitle">Loading your stories…</p>
    </div>

    <div class="card">
      <label for="name">Story Title</label>
      <input type="text" id="name" placeholder="e.g. The Last Question" />

      <label for="author">Author</label>
      <input type="text" id="author" placeholder="e.g. Isaac Asimov" />

      <label for="link">Website Link</label>
      <input type="url" id="link" placeholder="https://..." onblur="fetchMeta()" />
      <p class="fetch-status" id="fetchStatus"></p>

      <button class="add-btn" id="addBtn" onclick="addStory()">+ Add Story</button>
      <p class="error" id="error"></p>
    </div>

    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="search" placeholder="Search by title, author or source…" oninput="filterAndRender()" />
      <button class="search-clear" id="clearBtn" onclick="clearSearch()" title="Clear search">✕</button>
    </div>

    <p class="subtitle" id="count" style="margin-bottom:12px;"></p>
    <ul id="list"><div class="loading">Loading your stories…</div></ul>

    <!-- ── Embedding Tools ── -->
    <div class="tools-section">
      <button class="tools-toggle" onclick="toggleTools()">⚙ Embedding Tools</button>
      <div class="tools-panel" id="toolsPanel">

        <p class="embed-count" id="embedCount">Checking…</p>

        <label for="jinaKey">
          Jina API Key
          <a href="https://jina.ai" target="_blank" rel="noopener"
            style="color:#8b7fdf; text-transform:none; letter-spacing:0; font-size:0.75rem; margin-left:6px;">
            Get free key →
          </a>
        </label>
        <input type="password" id="jinaKey" placeholder="jina_…" />

        <div class="progress-wrap" id="progressWrap">
          <div class="progress-bar" id="progressBar"></div>
        </div>

        <p class="embed-status" id="embedStatus"></p>

        <button class="embed-btn" id="embedBtn" onclick="startBatchEmbed()">
          Embed next 10 stories
        </button>

      </div>
    </div>

  </div>

  <script>
    // ─── PASTE YOUR SUPABASE DETAILS HERE ───────────────────────────
    const SUPABASE_URL  = "https://rdjrwxwuyugmjsuvscsx.supabase.co";
    const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkanJ3eHd1eXVnbWpzdXZzY3N4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4MzAzOTEsImV4cCI6MjA5NjQwNjM5MX0.2xm0WOMaelheQAI1_NGkLdgUTkohiiolwsDxHT1Z-aU";
    // ────────────────────────────────────────────────────────────────

    const BASE = `${SUPABASE_URL}/rest/v1/stories`;
    const HEADERS = {
      "Content-Type": "application/json",
      "apikey": SUPABASE_ANON,
      "Authorization": `Bearer ${SUPABASE_ANON}`,
    };

    let allStories = [];

    // ── Load from Supabase, shuffle, then display ──────────────────
    async function loadStories() {
      const res = await fetch(`${BASE}?select=id,name,author,link`, { headers: HEADERS });
      allStories = await res.json();

      // Fisher-Yates shuffle
      for (let i = allStories.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [allStories[i], allStories[j]] = [allStories[j], allStories[i]];
      }

      filterAndRender();
    }

    // ── Filter by search term, then render ────────────────────────
    function filterAndRender() {
      const term     = document.getElementById("search").value.trim().toLowerCase();
      const clearBtn = document.getElementById("clearBtn");

      clearBtn.style.display = term ? "block" : "none";

      if (!term) { render(allStories, null); return; }

      const filtered = allStories.filter(s => {
        const domain = getDomain(s.link);
        return (
          (s.name   || "").toLowerCase().includes(term) ||
          (s.author || "").toLowerCase().includes(term) ||
          domain.toLowerCase().includes(term)
        );
      });

      render(filtered, allStories.length);
    }

    // ── Clear search ───────────────────────────────────────────────
    function clearSearch() {
      document.getElementById("search").value = "";
      filterAndRender();
      document.getElementById("search").focus();
    }

    // ── Auto-fill title & author from URL via Microlink ───────────
    async function fetchMeta() {
      const link   = document.getElementById("link").value.trim();
      const status = document.getElementById("fetchStatus");

      if (!link.startsWith("http")) return;
      if (document.getElementById("name").value.trim()) return;

      status.textContent = "Fetching page details…";

      try {
        const res  = await fetch(`https://api.microlink.io/?url=${encodeURIComponent(link)}`);
        const data = await res.json();

        if (data.status !== "success") {
          status.textContent = "Couldn't fetch details — fill in manually.";
          return;
        }

        const { title, author, publisher } = data.data;
        if (title)           document.getElementById("name").value   = title;
        if (author)          document.getElementById("author").value = author;
        else if (publisher)  document.getElementById("author").value = publisher;

        status.textContent = title
          ? "✓ Details filled in — edit if needed."
          : "No metadata found — fill in manually.";

        setTimeout(() => { status.textContent = ""; }, 3000);
      } catch {
        status.textContent = "Couldn't fetch details — fill in manually.";
      }
    }

    // ── Add a new story to Supabase ───────────────────────────────
    async function addStory() {
      const name   = document.getElementById("name").value.trim();
      const author = document.getElementById("author").value.trim();
      const link   = document.getElementById("link").value.trim();
      const error  = document.getElementById("error");
      const btn    = document.getElementById("addBtn");

      if (!name)   { error.textContent = "Please enter a story title."; return; }
      if (!author) { error.textContent = "Please enter an author name."; return; }
      if (!link)   { error.textContent = "Please enter a website link."; return; }
      if (!link.startsWith("http")) { error.textContent = "Link must start with https://"; return; }

      error.textContent = "";
      btn.disabled = true;
      btn.textContent = "Saving…";

      const res = await fetch(BASE, {
        method: "POST",
        headers: { ...HEADERS, "Prefer": "return=representation" },
        body: JSON.stringify({ name, author, link }),
      });

      btn.disabled = false;
      btn.textContent = "+ Add Story";

      if (res.ok) {
        document.getElementById("name").value   = "";
        document.getElementById("author").value = "";
        document.getElementById("link").value   = "";
        loadStories();
      } else {
        error.textContent = "Failed to save. Check your Supabase config.";
      }
    }

    // ── Delete with two-tap confirmation ──────────────────────────
    async function deleteStory(id, btn) {
      if (btn.dataset.confirm !== "true") {
        btn.dataset.confirm = "true";
        btn.textContent = "Delete?";
        btn.style.color = "#e05c7a";
        setTimeout(() => {
          if (btn.dataset.confirm === "true") {
            btn.dataset.confirm = "";
            btn.textContent = "✕";
            btn.style.color = "";
          }
        }, 3000);
        return;
      }

      btn.dataset.confirm = "";
      btn.disabled = true;
      btn.textContent = "…";
      btn.style.color = "";

      const res = await fetch(`${BASE}?id=eq.${id}`, {
        method: "DELETE",
        headers: { ...HEADERS, "Prefer": "return=minimal" },
      });

      if (res.ok) {
        loadStories();
      } else {
        btn.disabled = false;
        btn.textContent = "✕";
        btn.style.color = "";
        alert("Failed to delete. Check your Supabase RLS policy for DELETE.");
      }
    }

    // ── Extract domain from URL ────────────────────────────────────
    function getDomain(url) {
      try { return new URL(url).hostname.replace(/^www\./, ""); }
      catch { return ""; }
    }

    // ── Render the story list ─────────────────────────────────────
    function render(stories, total) {
      const list = document.getElementById("list");
      const sub  = document.getElementById("subtitle");
      const cnt  = document.getElementById("count");
      const n    = stories.length;

      sub.textContent = `${allStories.length} ${allStories.length === 1 ? "story" : "stories"} · shuffled on load`;

      if (total !== null) {
        cnt.textContent = n ? `${n} of ${total} ${total === 1 ? "story" : "stories"}` : "No results for that search";
      } else {
        cnt.textContent = "";
      }

      if (!n) {
        const msg = total !== null ? "No stories match your search." : "No stories yet. Add your first one above.";
        list.innerHTML = `<div class="empty"><div class="empty-icon">📖</div><div class="empty-msg">${msg}</div></div>`;
        return;
      }

      list.innerHTML = stories.map(s => {
        const domain = getDomain(s.link);
        return `
        <li>
          <div class="story-info">
            <a class="story-title" href="${s.link}" target="_blank" rel="noopener noreferrer">${s.name}</a>
            <div class="story-meta">
              <span class="story-author">${s.author || ""}</span>
              ${s.author && domain ? `<span class="meta-dot">·</span>` : ""}
              ${domain ? `<span class="story-site">${domain}</span>` : ""}
            </div>
          </div>
          <button class="del" onclick="deleteStory('${s.id}', this)" title="Remove">✕</button>
        </li>`;
      }).join("");
    }

    // ── Embedding Tools ───────────────────────────────────────────

    function toggleTools() {
      const panel = document.getElementById("toolsPanel");
      panel.classList.toggle("open");
      // Restore saved API key and refresh count when opening
      if (panel.classList.contains("open")) {
        const saved = localStorage.getItem("jinaKey");
        if (saved) document.getElementById("jinaKey").value = saved;
        refreshEmbedCount();
      }
    }

    // Show how many stories have been embedded so far
    async function refreshEmbedCount() {
      document.getElementById("embedCount").innerHTML = "Checking…";
      try {
        const res = await fetch(`${BASE}?select=id&embedding=not.is.null`, { headers: HEADERS });
        const embedded = await res.json();
        const n     = embedded.length;
        const total = allStories.length;
        document.getElementById("embedCount").innerHTML =
          `<span>${n}</span> of <span>${total}</span> stories embedded`;
      } catch {
        document.getElementById("embedCount").textContent = "Could not fetch count.";
      }
    }

    // Main batch embedding function — processes 10 unembedded stories
    async function startBatchEmbed() {
      const keyInput = document.getElementById("jinaKey");
      const key = keyInput.value.trim() || localStorage.getItem("jinaKey");

      if (!key) { setEmbedStatus("Please enter your Jina API key.", "error"); return; }

      localStorage.setItem("jinaKey", key);
      keyInput.value = key;

      // Fetch up to 10 stories that have no embedding yet, oldest first
      const res = await fetch(
        `${BASE}?select=id,name,link&embedding=is.null&order=id.asc&limit=10`,
        { headers: HEADERS }
      );
      const stories = await res.json();

      if (!stories.length) {
        setEmbedStatus("All stories are already embedded!", "success");
        return;
      }

      const progressWrap = document.getElementById("progressWrap");
      const embedBtn     = document.getElementById("embedBtn");
      progressWrap.style.display = "block";
      embedBtn.disabled = true;

      let done = 0, failed = 0;
      const total = stories.length;

      for (const story of stories) {
        setEmbedStatus(`Processing (${done + failed + 1}/${total}): ${story.name}`);
        updateProgress(done + failed, total);

        try {
          // Step 1 — fetch full story text via Jina Reader
          const content = await fetchStoryContent(story.link);
          if (!content) throw new Error("Empty content returned");

          // Step 2 — convert first 10,000 chars to embedding vector
          // (captures story themes without hitting token limits)
          const embedding = await getEmbedding(content.slice(0, 10000), key);
          if (!embedding) throw new Error("Embedding API returned nothing");

          // Step 3 — save full content + embedding to Supabase
          await saveEmbedding(story.id, content, embedding);
          done++;
        } catch (e) {
          console.warn(`Skipped "${story.name}":`, e.message);
          failed++;
        }

        // Wait 2s between requests — stays well within Jina's free rate limits
        await sleep(2000);
      }

      updateProgress(total, total);
      setEmbedStatus(
        `Done — ${done} embedded${failed ? `, ${failed} skipped (check console for details)` : ""}.`,
        failed === total ? "error" : failed ? "warn" : "success"
      );

      embedBtn.disabled = false;
      refreshEmbedCount();
    }

    // ── URL type helpers ─────────────────────────────────────────

    // Detects series/index pages by URL path — runs before any content fetch
    function isSeriesUrl(url) {
      try {
        const path = new URL(url).pathname;
        const segs = path.split("/").filter(Boolean);
        return segs.includes("se") || path.includes("/series/");
      } catch { return false; }
    }

    // Detects individual story links (/s/story-name pattern on Literotica)
    function isStoryLink(url) {
      try {
        const path = new URL(url).pathname;
        return path.startsWith("/s/") && path.split("/").filter(Boolean).length === 2;
      } catch { return false; }
    }

    // ── Router — decides which fetch strategy to use ──────────
    async function fetchStoryContent(url) {
      if (isSeriesUrl(url)) return fetchSeriesContent(url);
      return fetchSingleStoryContent(url);
    }

    // ── Series handler — fetches first 3 chapters from an index page ──
    async function fetchSeriesContent(url) {
      console.log(`[Series] Index page detected: ${url}`);

      const res = await fetch(`https://r.jina.ai/${url}`, {
        headers: { "X-No-Cache": "true" }
      });
      if (!res.ok) return null;

      const markdown = await res.text();

      // Extract all links from Jina's markdown output
      const linkPattern = /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g;
      const allLinks    = [];
      let m;
      while ((m = linkPattern.exec(markdown)) !== null) {
        allLinks.push({ text: m[1].trim(), url: m[2] });
      }

      // Keep only individual story links
      const storyLinks = allLinks.filter(l => isStoryLink(l.url));
      console.log(`[Series] Found ${storyLinks.length} story part links`);

      if (!storyLinks.length) {
        // No story links found — fall back to treating the page as direct content
        console.warn("[Series] No part links found — falling back to single page fetch");
        return fetchSingleStoryContent(url);
      }

      // Fetch content from first 3 chapters — enough for meaningful embedding
      const MAX_CHAPTERS  = 3;
      let combinedContent = "";

      for (let i = 0; i < Math.min(MAX_CHAPTERS, storyLinks.length); i++) {
        const chapter = storyLinks[i];
        console.log(`[Series] Fetching part ${i + 1}: ${chapter.url}`);

        try {
          const r  = await fetch(`https://r.jina.ai/${chapter.url}`, {
            headers: { "X-No-Cache": "true" }
          });
          if (!r.ok) throw new Error(`HTTP ${r.status}`);

          const md   = await r.text();
          const text = md
            .replace(/!\[[^\]]*\]\([^)]+\)/g, "")
            .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
            .replace(/^#{1,6}\s+/gm, "")
            .trim();

          console.log(`[Series] Part ${i + 1}: ${text.length} chars`);
          combinedContent += `\n\n--- Part ${i + 1}: ${chapter.text} ---\n\n` + text;
        } catch(e) {
          console.warn(`[Series] Part ${i + 1} failed:`, e.message);
        }

        if (i < MAX_CHAPTERS - 1) await sleep(1500);
      }

      if (!combinedContent) return null;
      return combinedContent.slice(0, 20000).trim();
    }

    // ── Single story handler — multi-page fetch with next-page detection ──
    async function fetchSingleStoryContent(url) {
      let allContent  = "";
      let currentUrl  = url;
      const maxPages  = 5;
      const visited   = new Set();

      for (let page = 1; page <= maxPages; page++) {
        if (!currentUrl || visited.has(currentUrl)) break;
        visited.add(currentUrl);

        const res = await fetch(`https://r.jina.ai/${currentUrl}`, {
          headers: { "X-No-Cache": "true" }
        });
        if (!res.ok) break;

        const markdown = await res.text();
        if (!markdown || markdown.length < 400) break;

        const clean = markdown
          .replace(/!\[[^\]]*\]\([^)]+\)/g, "")
          .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
          .replace(/^#{1,6}\s+/gm, "")
          .trim();

        allContent += (page > 1 ? "\n\n---\n\n" : "") + clean;
        currentUrl  = findNextPage(markdown, currentUrl);
        if (currentUrl) await sleep(1500);
      }

      if (!allContent) return null;
      return allContent.slice(0, 20000).trim();
    }

    // Detect the next page URL using two methods
    function findNextPage(markdown, currentUrl) {
      let baseHostname;
      try { baseHostname = new URL(currentUrl).hostname; }
      catch { return null; }

      // ── Method 1: scan Jina's markdown for explicit "next page" links ──
      // Jina renders HTML links as [visible text](href)
      // We match link text containing next/continue/→/chapter N etc.
      const nextTextPattern = /\[([^\]]*(?:next|continue|→|»|›|chapter\s*\d+|part\s*\d+)[^\]]*)\]\((https?:\/\/[^\s)]+)\)/gi;
      let match;
      while ((match = nextTextPattern.exec(markdown)) !== null) {
        try {
          const link = new URL(match[2]);
          if (link.hostname === baseHostname) return match[2]; // same-domain only
        } catch {}
      }

      // ── Method 2: auto-increment common URL pagination patterns ──
      try {
        const base = new URL(currentUrl);

        // Pattern A: ?page=1 → ?page=2
        const pageParam = base.searchParams.get("page");
        if (pageParam && !isNaN(pageParam)) {
          base.searchParams.set("page", parseInt(pageParam) + 1);
          return base.toString();
        }

        // Pattern B: /page/1/ → /page/2/
        const pagePathMatch = base.pathname.match(/\/page\/(\d+)/);
        if (pagePathMatch) {
          return currentUrl.replace(
            `/page/${pagePathMatch[1]}`,
            `/page/${parseInt(pagePathMatch[1]) + 1}`
          );
        }
      } catch {}

      return null; // no next page found — this was the last page
    }

    // Jina Embeddings: convert text → array of 768 numbers
    // Using v3 model — supports 89 languages including Telugu and English
    async function getEmbedding(text, key) {
      const res = await fetch("https://api.jina.ai/v1/embeddings", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${key}`,
        },
        body: JSON.stringify({
          model:      "jina-embeddings-v3",
          task:       "text-matching", // optimised for story-to-story similarity
          dimensions: 768,             // matches our vector(768) column in Supabase
          input:      [text],
        }),
      });
      if (!res.ok) return null;
      const data = await res.json();
      return data.data[0].embedding;
    }

    // Save content + embedding vector to Supabase
    // content = full multi-page text (up to 20,000 chars)
    // embedding is generated from first 10,000 chars only (embedding API limit)
    async function saveEmbedding(id, content, embedding) {
      const res = await fetch(`${BASE}?id=eq.${id}`, {
        method: "PATCH",
        headers: { ...HEADERS, "Prefer": "return=minimal" },
        body: JSON.stringify({
          content,
          embedding: `[${embedding.join(",")}]`, // Supabase expects vector as a string
        }),
      });
      if (!res.ok) throw new Error("Supabase PATCH failed");
    }

    // ── Helpers ───────────────────────────────────────────────────
    function updateProgress(done, total) {
      const pct = total ? Math.round((done / total) * 100) : 0;
      document.getElementById("progressBar").style.width = `${pct}%`;
    }

    function setEmbedStatus(msg, type) {
      const el = document.getElementById("embedStatus");
      el.textContent = msg;
      el.className = `embed-status ${type || ""}`.trim();
    }

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    // Enter key triggers addStory only when focus is NOT on search box
    document.addEventListener("keydown", e => {
      if (e.key === "Enter" && document.activeElement.id !== "search") addStory();
    });

    loadStories();
  </script>
</body>
